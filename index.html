<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>すみだ商品券 A券ランキング</title>
<style>
:root {
  --bg: #f7f6f3; --surface: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e4e2dc;
  --accent: #c2410c; --accent-soft: #fdecdf; --star: #e8a317; --bar: #f3c9a8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141416; --surface: #1d1d20; --text: #ececee; --muted: #a0a0a8; --line: #2e2e33;
    --accent: #fb923c; --accent-soft: #3a2416; --star: #f5b83d; --bar: #6b3a1c;
  }
}
:root[data-theme="dark"] {
  --bg: #141416; --surface: #1d1d20; --text: #ececee; --muted: #a0a0a8; --line: #2e2e33;
  --accent: #fb923c; --accent-soft: #3a2416; --star: #f5b83d; --bar: #6b3a1c;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.6;
}
.wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; }
.lead { color: var(--muted); margin: 0 0 20px; font-size: .9rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: 999px; padding: 6px 12px; font-size: .85rem; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip .n { opacity: .7; margin-left: 4px; font-size: .78rem; }
.tools { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.tools input {
  flex: 1; min-width: 180px; padding: 8px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: .95rem;
}
.tools .count { color: var(--muted); font-size: .85rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { font-size: .78rem; color: var(--muted); font-weight: 600; background: var(--surface); }
tr:last-child td { border-bottom: none; }
.rank { width: 3em; font-weight: 700; font-variant-numeric: tabular-nums; }
.top .rank { color: var(--accent); }
.name a { color: var(--text); text-decoration: none; font-weight: 600; }
.name a:hover { text-decoration: underline; }
.sub { display: block; color: var(--muted); font-size: .78rem; font-weight: 400; }
.sort {
  font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer;
  display: inline-flex; align-items: center; gap: 2px;
}
.sort::after { content: "↕"; opacity: .35; font-size: .9em; }
.sort[data-dir="desc"]::after { content: "↓"; opacity: 1; color: var(--accent); }
.sort[data-dir="asc"]::after { content: "↑"; opacity: 1; color: var(--accent); }
.sort[data-dir] { color: var(--text); }
.no-price .price { display: none; }
.sub-price, .sort-select { display: none; }
.sort-select select {
  padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); font-size: .9rem;
}
td.price { color: var(--muted); font-size: .85rem; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.star { color: var(--star); }
.score { position: relative; min-width: 90px; }
.score .bar { position: absolute; inset: 8px auto 8px 0; background: var(--bar); border-radius: 4px; opacity: .55; }
.score span { position: relative; }
details { margin-top: 16px; }
summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
.unrated { margin: 8px 0 0; padding-left: 1.2em; font-size: .88rem; color: var(--muted); }
.note { color: var(--muted); font-size: .8rem; margin-top: 24px; }
.note a { color: var(--muted); }
.card { overflow-x: auto; }
.near { display: none; }
.near-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.near button, .near select {
  padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); font-size: .9rem;
}
.near .go { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.near .msg { color: var(--muted); font-size: .8rem; margin: 6px 0 0; }
.near .msg:empty { display: none; }
.sub-dist { color: var(--accent); font-weight: 600; }
@media (max-width: 640px) {
  .chips { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px 16px; padding: 0 16px 4px; scrollbar-width: none; }
  .chip { flex: none; }
  table { font-size: .85rem; }
  th, td { padding: 8px 5px; }
  th:first-child, td:first-child { padding-left: 10px; }
  .rank { width: 2.2em; white-space: nowrap; }
  .score { min-width: 0; }
  .score .bar { display: none; }
  .price { display: none; }
  .sub-price { display: inline; }
  .sort-select { display: block; }
  .near { display: block; margin-bottom: 12px; }
}
</style>
</head>

<div class="wrap">
  <h1>すみだプレミアム付デジタル商品券 A券対象店ランキング</h1>
  <p class="lead" id="lead"></p>

        <option value="1000" selected>1km以内</option><option value="2000">2km以内</option>

    <p class="msg" id="nearMsg"></p>

  <div class="tools">

      <option value="dist:asc" hidden disabled>近い順</option>
      <option value="rating:desc">評価が高い順</option>
      <option value="reviews:desc">口コミが多い順</option>
      <option value="price_sort:asc">予算が安い順</option>
      <option value="price_sort:desc">予算が高い順</option>
    </select></label>
    <span class="count" id="count"></span>
  </div>
  <div class="card">
    <table>
      <thead><tr>
        <th class="rank">順位</th><th>店舗名</th>
        <th class="num price"><button class="sort" data-key="price_sort">予算</button></th>
        <th class="num"><button class="sort" data-key="rating">評価</button></th>
        <th class="num"><button class="sort" data-key="reviews">口コミ</button></th>
        <th class="num"><button class="sort" data-key="score">スコア</button></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <details id="unratedBox"><summary id="unratedSummary"></summary><ul class="unrated" id="unrated"></ul></details>
  <p class="note" id="note"></p>
</div>

  $("nearMsg").textContent = "現在地を取得しています…";
  navigator.geolocation.getCurrentPosition(
    (p) => { $("areaSel").value = ""; setCenter({ lat: p.coords.latitude, lng: p.coords.longitude }, "現在地からの距離で絞り込んでいます。"); },
    (e) => { $("nearMsg").textContent = e.code === 1
      ? "現在地の利用が許可されませんでした。町名から選んでください。"
      : "現在地を取得できませんでした。町名から選んでください。"; },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
});
$("areaSel").addEventListener("change", (e) => {
  const a = meta.areas[e.target.value];
  if (a) setCenter(a, `${a.name}の中心からの距離で絞り込んでいます。`); else setCenter(null, "");
});
$("radiusSel").addEventListener("change", () => { renderChips(); render(); });
$("clearBtn").addEventListener("click", () => { $("areaSel").value = ""; setCenter(null, ""); });
renderChips(); renderSort(); render();
</script>
</body>
</html>
